name: Toolchains
description: >
  The tools the justfile recipes call: just, uv, buf, Go (builds the angzarr
  CLI at the justfile's CLI_REV), Rust + protoc (build the router-ffi cdylib
  from the angzarr-router submodule).
runs:
  using: composite
  steps:
    - uses: extractions/setup-just@v2
    - uses: astral-sh/setup-uv@v6
    - uses: bufbuild/buf-action@v1
      with:
        setup_only: true
    - uses: actions/setup-go@v5
      with:
        go-version: "1.25"
        cache: false
    - name: protoc
      shell: bash
      run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: angzarr-router -> ../.router-target
