name: Toolchains
description: >
  The tools the justfile recipes call: just, uv, buf (renders the codegen
  templates) and Go (builds the angzarr CLI at the justfile's CLI_REV);
  protoc comes from grpcio-tools.
runs:
  using: composite
  steps:
    - uses: extractions/setup-just@v2
    - uses: astral-sh/setup-uv@v6
    - uses: bufbuild/buf-action@v1
      with:
        setup_only: true
    - uses: actions/setup-go@v5
      with:
        go-version: "1.25"
        cache: false
