name: Toolchains
description: >
  The tools the justfile recipes call: just, uv, buf (the CLI's scaffold
  runs it) and Rust (cargo builds the angzarr CLI at the justfile's
  CLI_REV; ubuntu-latest has it); protoc comes from grpcio-tools.
runs:
  using: composite
  steps:
    - uses: extractions/setup-just@v2
    - uses: astral-sh/setup-uv@v6
    - uses: bufbuild/buf-action@v1
      with:
        setup_only: true
