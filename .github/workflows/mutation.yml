name: Mutation Test

on:
  schedule:
    # Weekly, Monday 06:00 UTC — matches the Rust client's schedule.
    - cron: '0 6 * * 1'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  mutation-test:
    name: Mutation Test
    runs-on: ubuntu-latest
    timeout-minutes: 360
    container:
      image: ghcr.io/${{ github.repository }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Generate protos
        run: just proto

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Mutation test
        run: just mutation-test
