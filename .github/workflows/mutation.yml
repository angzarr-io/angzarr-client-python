name: Mutation Test

on:
  schedule:
    # Weekly, Monday 06:00 UTC — matches the Rust client's schedule.
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  mutation-test:
    name: Mutation Test
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: ./.github/actions/setup

      - name: Mutation test
        run: just mutation-test
