name: CI

# Thin by design: every step is a just recipe (see justfile). `just ci` runs
# format + lint, builds the router-ffi cdylib from the pinned angzarr-router
# submodule, runs the unit / binding / router-conformance / client-feature
# suites, and renders the angzarr-project example protos with this
# repository's codegen templates and checks the result loads and registers.

on:
  push:
    branches: [main]
  pull_request:
  repository_dispatch:
    types: [protos-updated]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: ./.github/actions/setup
      - run: just ci

  build:
    runs-on: ubuntu-latest
    needs: [ci]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: ./.github/actions/setup
      - run: just build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  notify-downstream:
    name: Notify Downstream Repos
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - name: Trigger examples-python rebuild
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.REPO_DISPATCH_TOKEN }}
          repository: angzarr-io/angzarr-examples-python
          event-type: client-updated
          client-payload: '{"ref": "${{ github.ref }}", "sha": "${{ github.sha }}"}'
