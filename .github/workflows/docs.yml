name: Docs

# Builds Sphinx HTML on every push to main and publishes it to GitHub Pages.
# The angzarr-project Starlight site links to this URL under its SDKs →
# By Language → Python sidebar entry.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: ./.github/actions/setup

      - name: Build Sphinx HTML
        run: just docs

      # Configure the custom domain. GitHub Pages reads this file on deploy
      # and serves the site at the domain specified; the DNS CNAME
      # `python.angzarr.io → angzarr-io.github.io` handles routing.
      - name: Write CNAME
        run: echo "python.angzarr.io" > docs/_build/html/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
