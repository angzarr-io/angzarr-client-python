# Lefthook configuration
# https://github.com/evilmartians/lefthook
#
# Setup: lefthook install
# Bypass: git commit --no-verify (or LEFTHOOK=0 git commit)

pre-commit:
  parallel: false
  commands:
    fmt:
      run: just fmt-fix
      stage_fixed: true
    test:
      run: just test

pre-push:
  parallel: false
  commands:
    # Gate the 80% mutation kill rate. Bypass with LEFTHOOK=0 git push.
    mutation:
      tags: slow
      run: just mutation-test
