[build-system]
# grpcio-tools generates the framework protos (protoc + gRPC plugin, protobuf
# 7.x gencode; hatch_build.py, scripts/proto_build.py).
requires = ["hatchling", "grpcio-tools>=1.84,<1.85"]
build-backend = "hatchling.build"

[project]
name = "angzarr-client"
dynamic = ["version"]
description = "Angzarr for Python: the router, the component host, and the coordinator clients"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.10"
authors = [
    { name = "Benjamin Abbitt" }
]
keywords = ["angzarr", "grpc", "event-sourcing", "cqrs"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # The *_pb2_grpc.py modules grpcio-tools generates at build time refuse to
    # import on a grpcio older than the generating version (1.84.1, the newest
    # release the grpcio-tools range in [build-system] admits).
    "grpcio>=1.84.1",
    "grpcio-health-checking>=1.76.0",
    # google.rpc.Status / ErrorInfo and google.api.
    "googleapis-common-protos>=1.65",
    # protocolbuffers/python:v35.1 gencode targets the protobuf 7.x runtime.
    "protobuf>=7.35.1,<8",
    "structlog>=24.0.0",
]

[project.urls]
Homepage = "https://github.com/angzarr-io/angzarr-client-python"
Repository = "https://github.com/angzarr-io/angzarr-client-python"
Documentation = "https://angzarr.io/docs"

[project.optional-dependencies]
dev = [
    "grpcio-tools>=1.84,<1.85",
    # pytest 9.2 removed FixtureManager._arg2fixturedefs, which pytest-bdd
    # 9.0 reads to run every scenario; uv.lock is not committed, so the
    # bound is what keeps a fresh environment working.
    "pytest>=8.0.0,<9.2",
    "pytest-asyncio>=0.23.0",
    "pytest-bdd>=7.0.0",
    "pytest-cov>=4.1.0",
    "pytest-timeout>=2.3",
    "mutmut>=2.5.0",
    "ruff>=0.4.0",
    "black>=24.0.0",
    "import-linter==2.15",
]
docs = [
    "sphinx>=8.0.0",
    "sphinx-autoapi>=3.3.0",
    "myst-parser>=4.0.0",
    "furo>=2024.8.6",
]

[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>.+)"

[tool.hatch.build]
# Generated protos are built into the wheel, not kept in git.
artifacts = [
    "angzarr_client/proto/**/*.py",
    "angzarr_client/proto/**/*.pyi",
]

[tool.hatch.build.targets.wheel]
packages = ["angzarr_client"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
# Everything a wheel build needs: the package, the build hook and scripts,
# and the spec protos at their pinned revision.
include = [
    "angzarr_client/**/*.py",
    "hatch_build.py",
    "scripts/",
    "VERSION",
    "README.md",
    "LICENSE",
    "angzarr-project/proto/",
]
exclude = ["angzarr_client/proto/io", "angzarr_client/proto/sererr"]

[tool.pytest.ini_options]
# Feature paths are relative to the angzarr-project submodule
# (features/client/…, features/handler-contract/…, parity/client/…).
bdd_features_base_dir = "angzarr-project"
testpaths = ["tests"]
norecursedirs = ["mutants", "angzarr-project"]
asyncio_mode = "auto"
# A hung test fails the run instead of stalling it: after the timeout every
# thread's stack is dumped and the process exits (the thread method also
# fires while the main thread is blocked in a C-level wait).
timeout = 120
timeout_method = "thread"
# The spec's category tags on the bound features (pytest-bdd turns each
# Gherkin tag into a mark), registered so pytest knows them. Scenario-id
# tags (@C-NNNN, @EU-NNNN, @EA-NNNN) are not turned into marks at all
# (tests/conftest.py, pytest_bdd_apply_tag).
markers = [
    "commutative: handling.feature, the COMMUTATIVE conflict report",
    "conflict_nonce: handling.feature, the AGGREGATE_HANDLES conflict nonce",
    "context: context.feature, facts and handler context",
    "counter: counter_dispatch.feature, the CounterAggregate",
    "describe: handling.feature, one component per business process",
    "error_keys: handling.feature, errors as a key and its args",
    "folding: handling.feature, folding every page given",
    "policy: handling.feature and policy_dispatch.feature, policy reactions",
    "policy_refusal: handling.feature, a policy's translating callback",
    "projector: projector_dispatch.feature, the CounterProjector",
    "recorded_at: handling.feature, when the input was accepted",
    "rules_version: handling.feature, the build version on answers",
    "snapshot_source: handling.feature, the state answered on every response",
    "unknown_type: handling.feature, a type no handler claims",
]

[tool.mutmut]
source_paths = [
    "angzarr_client/builder.py",
    "angzarr_client/client.py",
    "angzarr_client/descriptor.py",
    "angzarr_client/errors.py",
    "angzarr_client/helpers.py",
    "angzarr_client/host.py",
    "angzarr_client/identity.py",
    "angzarr_client/retry.py",
    "angzarr_client/server.py",
    "angzarr_client/validation.py",
    "angzarr_client/wrappers.py",
    "angzarr_client/router/aggregate.py",
    "angzarr_client/router/context.py",
    "angzarr_client/router/errors.py",
    "angzarr_client/router/policy.py",
    "angzarr_client/router/projector.py",
    "angzarr_client/router/router.py",
]
pytest_add_cli_args_test_selection = ["tests/"]
# mutmut runs the suite from a copy under mutants/: the tests read the spec
# features and fixtures (angzarr-project) and scripts/ in place.
also_copy = ["angzarr_client/", "angzarr-project/", "scripts/"]
# Workers fork from a fork server free of the suite's gRPC threads: forked
# straight from the process that ran the host tests, a worker can hang or
# crash in gRPC's fork handling, which reads as a timeout, not a verdict.
process_isolation = "forkserver"

[tool.ruff]
exclude = [
    "angzarr_client/proto",
    "tests/",
    ".codegen-check/",
    # Submodule — owned by angzarr-project, contains symlinks
    # (features/example/acceptance/environment.py → tests/example/acceptance/...)
    # that resolve only inside the angzarr-project repo layout, not
    # when checked out as a submodule here. Lint there, not here.
    "angzarr-project/",
]

[tool.black]
target-version = ["py310", "py311", "py312"]
extend-exclude = '''
(
    angzarr_client/proto
    | \.venv
    | angzarr-project
    | tests/router/gen
    | \.codegen-check
)
'''
