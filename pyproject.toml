[build-system]
# grpcio-tools generates the framework protos (protoc + gRPC plugin, protobuf
# 7.x gencode) and serves prost-build's protoc while cargo builds the
# router-ffi library (hatch_build.py, scripts/native_build.py). Building a
# wheel needs cargo on PATH and Linux x86_64.
requires = ["hatchling", "grpcio-tools>=1.84,<1.85"]
build-backend = "hatchling.build"

[project]
name = "angzarr-client"
dynamic = ["version"]
description = "Angzarr for Python: the router binding (the shared Rust engine over cffi), codegen templates, and the coordinator clients"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.10"
authors = [
    { name = "Benjamin Abbitt" }
]
keywords = ["angzarr", "grpc", "event-sourcing", "cqrs"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # cffi ABI mode (ffi.dlopen) over the router-ffi cdylib.
    "cffi>=1.16",
    # The *_pb2_grpc.py modules grpcio-tools generates at build time refuse to
    # import on a grpcio older than the generating version (1.84.1, the newest
    # release the grpcio-tools range in [build-system] admits).
    "grpcio>=1.84.1",
    # 1.82 is the first release whose protobuf range admits 7.x; every
    # earlier one requires protobuf<7, which the floor below rules out.
    "grpcio-health-checking>=1.82",
    # google.rpc.Status / ErrorInfo and google.api.
    "googleapis-common-protos>=1.65",
    # protocolbuffers/python:v35.1 gencode targets the protobuf 7.x runtime.
    "protobuf>=7.35.1,<8",
    "structlog>=24.0.0",
]

[project.urls]
Homepage = "https://github.com/angzarr-io/angzarr-client-python"
Repository = "https://github.com/angzarr-io/angzarr-client-python"
Documentation = "https://angzarr.io/docs"

[project.optional-dependencies]
dev = [
    "grpcio-tools>=1.84,<1.85",
    # Below 9.2: pytest 9.2.0 (2026-10-27) breaks pytest-bdd 9.0.0, which reads
    # the FixtureManager._arg2fixturedefs that 9.2 removed (every scenario test
    # fails with AttributeError). Revisit when a pytest-bdd release supports
    # pytest 9.2, then lift the ceiling.
    "pytest>=9.1,<9.2",
    "pytest-asyncio>=0.23.0",
    "pytest-bdd>=7.0.0",
    "pytest-cov>=4.1.0",
    "pytest-timeout>=2.3",
    "mutmut>=2.5.0",
    "ruff>=0.4.0",
    "black>=24.0.0",
    "import-linter==2.15",
]
docs = [
    "sphinx>=8.0.0",
    "sphinx-autoapi>=3.3.0",
    "myst-parser>=4.0.0",
    "furo>=2024.8.6",
]

[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>.+)"

[tool.hatch.build]
# Generated protos and the router-ffi library are built into the wheel, not
# kept in git.
artifacts = [
    "angzarr_client/proto/**/*.py",
    "angzarr_client/proto/**/*.pyi",
    "angzarr_client/router/_lib/*",
]

[tool.hatch.build.targets.wheel]
packages = ["angzarr_client"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
# Everything a wheel build needs: the package, the build hook and scripts,
# the spec protos and the router workspace at their pinned revisions (every
# workspace member's manifest, and the angzarr-proto crate from the router's
# own angzarr-project submodule).
include = [
    "angzarr_client/**/*.py",
    "codegen/",
    "hatch_build.py",
    "scripts/",
    "VERSION",
    "README.md",
    "LICENSE",
    "angzarr-project/proto/",
    "angzarr-router/Cargo.toml",
    "angzarr-router/Cargo.lock",
    "angzarr-router/crates/",
    "angzarr-router/proto/",
    "angzarr-router/tools/archlint/",
    "angzarr-router/angzarr-project/rust/angzarr-proto/",
]
exclude = ["angzarr_client/proto/io", "angzarr_client/proto/sererr"]

[tool.pytest.ini_options]
# Feature paths are relative to the angzarr-project submodule
# (features/client/…, parity/client/…); the router conformance steps use the
# angzarr-router submodule's absolute paths.
bdd_features_base_dir = "angzarr-project"
testpaths = ["tests"]
norecursedirs = ["mutants", "angzarr-project", "angzarr-router"]
asyncio_mode = "auto"
# A hung test fails the run instead of stalling it: after the timeout every
# thread's stack is dumped and the process exits (the thread method also
# fires while the main thread is blocked in a C-level wait).
timeout = 120
timeout_method = "thread"
# The spec's category tags on the bound features (pytest-bdd turns each
# Gherkin tag into a mark), registered so pytest knows them. Scenario-id
# tags (@C-NNNN, @EU-NNNN, @EA-NNNN) are not turned into marks at all
# (tests/conftest.py, pytest_bdd_apply_tag).
markers = [
    "commutative: handling.feature, COMMUTATIVE conflict resolution",
    "conflict_nonce: handling.feature, the AGGREGATE_HANDLES conflict nonce",
    "describe: handling.feature, describing the process (ComponentService.Describe)",
    "rules_version: handling.feature, the build version on answers and descriptions",
    "saga: handling.feature, a saga's one destination",
    "snapshot_source: handling.feature, the state answered on every response",
    "upcasting: handling.feature, command and fact upcasting",
]

[tool.mutmut]
source_paths = [
    "angzarr_client/builder.py",
    "angzarr_client/client.py",
    "angzarr_client/errors.py",
    "angzarr_client/helpers.py",
    "angzarr_client/host.py",
    "angzarr_client/identity.py",
    "angzarr_client/retry.py",
    "angzarr_client/server.py",
    "angzarr_client/validation.py",
    "angzarr_client/wrappers.py",
    "angzarr_client/router/_dispatch.py",
]
pytest_add_cli_args_test_selection = ["tests/"]
# mutmut runs the suite from a copy under mutants/: the tests read the spec
# features (angzarr-project), the router conformance suite (angzarr-router)
# and scripts/ in place.
also_copy = ["angzarr_client/", "angzarr-project/", "angzarr-router/", "scripts/", "codegen/"]

[tool.ruff]
exclude = [
    "angzarr_client/proto",
    "tests/",
    "angzarr-router/",
    ".codegen-check/",
    # Submodule — owned by angzarr-project, contains symlinks
    # (features/example/acceptance/environment.py → tests/example/acceptance/...)
    # that resolve only inside the angzarr-project repo layout, not
    # when checked out as a submodule here. Lint there, not here.
    "angzarr-project/",
]

[tool.black]
target-version = ["py310", "py311", "py312"]
extend-exclude = '''
(
    angzarr_client/proto
    | \.venv
    | angzarr-project
    | angzarr-router
    | tests/router/gen
    | \.codegen-check
)
'''
