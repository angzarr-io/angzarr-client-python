[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "angzarr-client"
dynamic = ["version"]
description = "Python client library for Angzarr gRPC services"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.10"
authors = [
    { name = "Benjamin Abbitt" }
]
keywords = ["angzarr", "grpc", "event-sourcing", "cqrs"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "grpcio>=1.60.0",
    "grpcio-health-checking>=1.60.0",
    "googleapis-common-protos>=1.62.0",
    "protobuf>=5.29.0",
    "structlog>=24.0.0",
]

[project.urls]
Homepage = "https://github.com/angzarr-io/angzarr-client-python"
Repository = "https://github.com/angzarr-io/angzarr-client-python"
Documentation = "https://angzarr.io/docs"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-bdd>=7.0.0",
    "pytest-cov>=4.1.0",
    "mutmut>=2.5.0",
    "sqlalchemy>=2.0.0",
    "grpcio-tools>=1.60.0",
    "ruff>=0.4.0",
    "black>=24.0.0",
]
docs = [
    "sphinx>=8.0.0",
    "sphinx-autoapi>=3.3.0",
    "myst-parser>=4.0.0",
    "furo>=2024.8.6",
]

[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>.+)"

[tool.hatch.build]
# Include generated proto files even though they're not in git
artifacts = ["angzarr_client/proto/**/*.py"]

[tool.hatch.build.targets.wheel]
packages = ["angzarr_client"]

[tool.pytest.ini_options]
bdd_features_base_dir = "angzarr-project/features/client"
testpaths = ["tests"]
norecursedirs = ["mutants"]
filterwarnings = [
    # pytest-bdd converts each Gherkin tag into a pytest mark. Scenario IDs
    # (@C-NNNN, @EU-NNNN, @EA-NNNN) collide with PytestUnknownMarkWarning.
    "ignore:Unknown pytest.mark.C-:pytest.PytestUnknownMarkWarning",
    "ignore:Unknown pytest.mark.EU-:pytest.PytestUnknownMarkWarning",
    "ignore:Unknown pytest.mark.EA-:pytest.PytestUnknownMarkWarning",
    # Category tags on merge_strategy.feature.
    "ignore:Unknown pytest.mark.merge_:pytest.PytestUnknownMarkWarning",
    "ignore:Unknown pytest.mark.edge_case:pytest.PytestUnknownMarkWarning",
]

[tool.mutmut]
paths_to_mutate = [
    "angzarr_client/builder.py",
    "angzarr_client/client.py",
    "angzarr_client/compensation.py",
    "angzarr_client/destinations.py",
    "angzarr_client/errors.py",
    "angzarr_client/event_packing.py",
    "angzarr_client/helpers.py",
    "angzarr_client/identity.py",
    "angzarr_client/protoname.py",
    "angzarr_client/retry.py",
    "angzarr_client/server.py",
    "angzarr_client/validation.py",
    "angzarr_client/wrappers.py",
    "angzarr_client/router/builder.py",
    "angzarr_client/router/decorators.py",
    "angzarr_client/router/dispatch.py",
    "angzarr_client/router/responses.py",
    "angzarr_client/router/runtime.py",
    "angzarr_client/router/server.py",
    "angzarr_client/router/validation.py",
]
pytest_add_cli_args_test_selection = ["tests/", "--ignore=tests/client"]
also_copy = ["angzarr_client/"]

[tool.ruff]
exclude = [
    "angzarr_client/proto",
    "tests/",
    # Submodule — owned by angzarr-project, contains symlinks
    # (features/example/acceptance/environment.py → tests/example/acceptance/...)
    # that resolve only inside the angzarr-project repo layout, not
    # when checked out as a submodule here. Lint there, not here.
    "angzarr-project/",
]

[tool.black]
target-version = ["py310", "py311", "py312"]
extend-exclude = '''
(
    angzarr_client/proto
    | \.venv
)
'''
